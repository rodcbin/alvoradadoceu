<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada — Alvorada do Céu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Poppins", "Segoe UI", sans-serif; color: #f2ede4; background: linear-gradient(180deg, #12101f, #0b0a12); }
    main { padding: 40px 20px; }
    .ico { font-size: 3rem; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 12px 0 8px; }
    p { color: rgba(242, 237, 228, 0.62); margin: 0 0 24px; }
    a { display: inline-block; padding: 13px 26px; border-radius: 999px; text-decoration: none; font-weight: 600; color: #1a1408; background: linear-gradient(135deg, #f0d17a, #d4af37 55%, #a8852a); box-shadow: 0 8px 26px rgba(212, 175, 55, 0.28); }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="ico">🕊️</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido.</p>
    <a href="/">Voltar para a página inicial ✧</a>
  </main>
</body>
</html>

# =========================================================
# Alvorada do Céu — configuração Netlify
# =========================================================

[build]
  # apenas os estáticos são publicados; código e segredos ficam fora do ar
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------
# Headers de segurança (todas as páginas)
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://image.pollinations.ai https://api.cloudflare.com https://api.pexels.com https://pixabay.com; object-src 'none'; base-uri 'self'"

# ---------------------------------------------------------
# Caching
# ---------------------------------------------------------
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ---------------------------------------------------------
# Bloqueio de caminhos sensíveis (defesa extra — a raiz
# já não é publicada, mas garantimos o 403/404)
# ---------------------------------------------------------
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
